<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الإدارة — دليل شبين الكوم الطبي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Cairo", sans-serif;
      background: #f6f8fb;
      color: #1f2937;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .topbar {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .title {
      font-size: 22px;
      font-weight: 800;
    }
    .muted {
      color: #6b7280;
      font-size: 14px;
    }
    .login-box, .panel, .request-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,.04);
    }
    .login-box {
      max-width: 460px;
      margin: 60px auto;
      padding: 24px;
    }
    .login-box h2 {
      margin-top: 0;
      font-size: 24px;
    }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
    }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary {
      background: #0f766e;
      color: #fff;
    }
    .btn-secondary {
      background: #111827;
      color: #fff;
    }
    .btn-danger {
      background: #dc2626;
      color: #fff;
    }
    .btn-warning {
      background: #d97706;
      color: #fff;
    }
    .btn-light {
      background: #f3f4f6;
      color: #111827;
      border: 1px solid #e5e7eb;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .toolbar-left, .toolbar-right {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .panel {
      padding: 16px;
      margin-bottom: 18px;
    }
    .requests-grid {
      display: grid;
      gap: 16px;
    }
    .request-card {
      padding: 18px;
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .doctor-name {
      font-size: 22px;
      font-weight: 800;
      margin: 0;
    }
    .card-subtitle {
      color: #6b7280;
      margin-top: 4px;
      font-size: 14px;
    }
    .badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid transparent;
    }
    .status-pending {
      background: #fef3c7;
      color: #92400e;
      border-color: #fcd34d;
    }
    .status-approved {
      background: #dcfce7;
      color: #166534;
      border-color: #86efac;
    }
    .status-ignored {
      background: #fee2e2;
      color: #991b1b;
      border-color: #fca5a5;
    }
    .type-add {
      background: #dbeafe;
      color: #1d4ed8;
      border-color: #93c5fd;
    }
    .type-edit {
      background: #ede9fe;
      color: #6d28d9;
      border-color: #c4b5fd;
    }
    .card-body {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 18px;
    }
    .doctor-image {
      width: 140px;
      height: 140px;
      border-radius: 16px;
      background: #f3f4f6;
      overflow: hidden;
      border: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      color: #6b7280;
      font-weight: 800;
    }
    .doctor-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px 16px;
    }
    .detail-item {
      background: #f9fafb;
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #eef2f7;
    }
    .detail-label {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
      font-weight: 700;
    }
    .detail-value {
      font-size: 14px;
      font-weight: 700;
      word-break: break-word;
    }
    .notes-box {
      margin-top: 14px;
      background: #fff7ed;
      border: 1px solid #fdba74;
      border-radius: 12px;
      padding: 12px;
    }
    .card-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #6b7280;
    }
    .msg {
      margin-top: 10px;
      font-weight: 700;
      font-size: 14px;
    }
    .hidden {
      display: none !important;
    }
    .count-box {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .count-chip {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
    }
    @media (max-width: 800px) {
      .card-body {
        grid-template-columns: 1fr;
      }
      .doctor-image {
        width: 100%;
        height: 220px;
      }
      .details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="loginView" class="container">
    <div class="login-box">
      <h2>تسجيل دخول الإدارة</h2>
      <p class="muted">ادخل كلمة السر لعرض طلبات الإضافة والتعديل.</p>
      <div class="field">
        <label for="adminPassword">كلمة السر</label>
        <input id="adminPassword" type="password" placeholder="اكتب كلمة السر">
      </div>
      <button id="loginBtn" class="btn btn-primary">دخول</button>
      <div id="loginMsg" class="msg"></div>
    </div>
  </div>

  <div id="adminView" class="hidden">
    <div class="topbar">
      <div class="topbar-inner">
        <div>
          <div class="title">لوحة إدارة الطلبات</div>
          <div class="muted">مراجعة طلبات الإضافة والتعديل</div>
        </div>
        <div class="toolbar-right">
          <button id="refreshBtn" class="btn btn-light">تحديث</button>
          <button id="logoutBtn" class="btn btn-secondary">تسجيل خروج</button>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="panel">
        <div class="toolbar">
          <div class="toolbar-left">
            <select id="statusFilter">
              <option value="all">كل الحالات</option>
              <option value="pending">Pending</option>
              <option value="approved">Approved</option>
              <option value="ignored">Ignored</option>
            </select>

            <select id="typeFilter">
              <option value="all">كل الأنواع</option>
              <option value="add">إضافة</option>
              <option value="edit">تعديل</option>
            </select>

            <input id="searchInput" type="text" placeholder="ابحث بالاسم أو التخصص أو الرقم">
          </div>

          <div class="count-box">
            <div class="count-chip">إجمالي: <span id="countAll">0</span></div>
            <div class="count-chip">Pending: <span id="countPending">0</span></div>
            <div class="count-chip">Approved: <span id="countApproved">0</span></div>
            <div class="count-chip">Ignored: <span id="countIgnored">0</span></div>
          </div>
        </div>
      </div>

      <div id="requestsGrid" class="requests-grid"></div>
      <div id="emptyState" class="panel empty hidden">لا توجد طلبات مطابقة.</div>
    </div>
  </div>

  <script>
    const WORKER_BASE_URL = 'https://shebin-medical-admin.yoyo-yara-hassan.workers.dev';

    const loginView = document.getElementById('loginView');
    const adminView = document.getElementById('adminView');
    const adminPasswordInput = document.getElementById('adminPassword');
    const loginBtn = document.getElementById('loginBtn');
    const loginMsg = document.getElementById('loginMsg');
    const requestsGrid = document.getElementById('requestsGrid');
    const emptyState = document.getElementById('emptyState');
    const refreshBtn = document.getElementById('refreshBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const statusFilter = document.getElementById('statusFilter');
    const typeFilter = document.getElementById('typeFilter');
    const searchInput = document.getElementById('searchInput');

    const countAll = document.getElementById('countAll');
    const countPending = document.getElementById('countPending');
    const countApproved = document.getElementById('countApproved');
    const countIgnored = document.getElementById('countIgnored');

    let allRequests = [];

    function getSavedPassword() {
      return localStorage.getItem('smg_admin_password') || '';
    }

    function savePassword(password) {
      localStorage.setItem('smg_admin_password', password);
    }

    function clearPassword() {
      localStorage.removeItem('smg_admin_password');
    }

    function getStatusBadge(status) {
      const value = status || 'pending';
      const cls = value === 'approved'
        ? 'status-approved'
        : value === 'ignored'
        ? 'status-ignored'
        : 'status-pending';
      const label = value === 'approved'
        ? 'Approved - موافق عليه'
        : value === 'ignored'
        ? 'Ignored - متجاهل'
        : 'Pending - قيد المراجعة';
      return `<span class="badge ${cls}">${label}</span>`;
    }

    function getTypeBadge(type) {
      const value = type || 'add';
      const cls = value === 'edit' ? 'type-edit' : 'type-add';
      const label = value === 'edit' ? 'تعديل' : 'إضافة';
      return `<span class="badge ${cls}">${label}</span>`;
    }

    function esc(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function getWorkerErrorMessage(res) {
      let raw = '';

      try {
        raw = await res.text();
      } catch (err) {
        raw = '';
      }

      let message = raw;

      try {
        const parsed = raw ? JSON.parse(raw) : null;
        message = (parsed && (parsed.error || parsed.message || parsed.details)) || raw;
      } catch (err) {
        message = raw;
      }

      if (String(message || '').includes('Duplicate doctor phone detected')) {
        return 'هذا الطبيب أو رقم الهاتف موجود بالفعل';
      }

      return message || 'حصل خطأ أثناء تحديث الحالة';
    }

    function requestMatches(item) {
      const statusValue = statusFilter.value;
      const typeValue = typeFilter.value;
      const q = searchInput.value.trim().toLowerCase();

      const statusOk = statusValue === 'all' || (item.status || 'pending') === statusValue;
      const typeOk = typeValue === 'all' || (item.request_type || 'add') === typeValue;

      const haystack = [
        item.doctor_name,
        item.specialty,
        item.phone1,
        item.phone2,
        item.phone3,
        item.address,
        item.subtitle
      ].join(' ').toLowerCase();

      const searchOk = !q || haystack.includes(q);

      return statusOk && typeOk && searchOk;
    }

    function renderCounts() {
      countAll.textContent = allRequests.length;
      countPending.textContent = allRequests.filter(r => (r.status || 'pending') === 'pending').length;
      countApproved.textContent = allRequests.filter(r => (r.status || 'pending') === 'approved').length;
      countIgnored.textContent = allRequests.filter(r => (r.status || 'pending') === 'ignored').length;
    }

    function renderRequests() {
      renderCounts();

      const filtered = allRequests.filter(requestMatches);

      if (!filtered.length) {
        requestsGrid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      requestsGrid.innerHTML = filtered.map(item => {
        const imageHtml = item.image
          ? `<img src="${esc(item.image)}" alt="${esc(item.doctor_name)}">`
          : `<span>${esc((item.doctor_name || 'د').charAt(0))}</span>`;
        const notesHtml = item.notes
          ? `<div class="notes-box">
              <strong>ملاحظات:</strong><br>
              ${esc(item.notes)}
            </div>`
          : '';

        return `
          <div class="request-card">
            <div class="card-head">
              <div>
                <h3 class="doctor-name">${esc(item.doctor_name || 'بدون اسم')}</h3>
                <div class="card-subtitle">
                  ${esc(item.specialty || 'بدون تخصص')} • ${esc(item.created_at || '')}
                </div>
              </div>
              <div class="badges">
                ${getStatusBadge(item.status)}
                ${getTypeBadge(item.request_type)}
              </div>
            </div>

            <div class="card-body">
              <div class="doctor-image">${imageHtml}</div>

              <div>
                <div class="details">
                  <div class="detail-item">
                    <div class="detail-label">الوصف المختصر</div>
                    <div class="detail-value">${esc(item.subtitle || '-')}</div>
                  </div>
                  <div class="detail-item">
                    <div class="detail-label">العنوان</div>
                    <div class="detail-value">${esc(item.address || '-')}</div>
                  </div>
                  <div class="detail-item">
                    <div class="detail-label">رقم 1</div>
                    <div class="detail-value">${esc(item.phone1 || '-')}</div>
                  </div>
                  <div class="detail-item">
                    <div class="detail-label">رقم 2</div>
                    <div class="detail-value">${esc(item.phone2 || '-')}</div>
                  </div>
                  <div class="detail-item">
                    <div class="detail-label">رقم 3</div>
                    <div class="detail-value">${esc(item.phone3 || '-')}</div>
                  </div>
                  <div class="detail-item">
                    <div class="detail-label">المواعيد</div>
                    <div class="detail-value">${esc(item.hours || '-')}</div>
                  </div>
                  <div class="detail-item">
                    <div class="detail-label">الخدمات</div>
                    <div class="detail-value">${esc(item.services || '-')}</div>
                  </div>
                  <div class="detail-item">
                    <div class="detail-label">النوع</div>
                    <div class="detail-value">${esc(item.gender || '-')}</div>
                  </div>
                  <div class="detail-item">
                    <div class="detail-label">Slug</div>
                    <div class="detail-value">${esc(item.slug || '-')}</div>
                  </div>
                  <div class="detail-item">
                    <div class="detail-label">الحالة الحالية</div>
                    <div class="detail-value">${esc(item.status || 'pending')}</div>
                  </div>
                </div>

                ${notesHtml}

                <div class="card-actions">
                  <button class="btn btn-primary" onclick="updateRequestStatus('${item.id}', 'approved')">Approve</button>
                  <button class="btn btn-danger" onclick="updateRequestStatus('${item.id}', 'ignored')">Ignore</button>
                  <button class="btn btn-warning" onclick="updateRequestStatus('${item.id}', 'pending')">رجّع Pending</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function fetchRequests() {
      const password = getSavedPassword();
      if (!password) return;

      requestsGrid.innerHTML = '<div class="panel">جارٍ تحميل الطلبات...</div>';

      const res = await fetch(`${WORKER_BASE_URL}/requests`, {
        method: 'GET',
        headers: {
          'x-admin-password': password
        }
      });

      if (res.status === 401) {
        clearPassword();
        adminView.classList.add('hidden');
        loginView.classList.remove('hidden');
        loginMsg.style.color = '#dc2626';
        loginMsg.textContent = 'كلمة السر غير صحيحة.';
        return;
      }

      allRequests = await res.json();
      renderRequests();
    }

    async function login() {
      const password = adminPasswordInput.value.trim();
      if (!password) {
        loginMsg.style.color = '#dc2626';
        loginMsg.textContent = 'اكتب كلمة السر.';
        return;
      }

      loginBtn.disabled = true;
      loginMsg.textContent = 'جارٍ التحقق...';

      const res = await fetch(`${WORKER_BASE_URL}/requests`, {
        method: 'GET',
        headers: {
          'x-admin-password': password
        }
      });

      if (res.status === 401) {
        loginMsg.style.color = '#dc2626';
        loginMsg.textContent = 'كلمة السر غير صحيحة.';
        loginBtn.disabled = false;
        return;
      }

      savePassword(password);
      loginView.classList.add('hidden');
      adminView.classList.remove('hidden');

      allRequests = await res.json();
      renderRequests();

      loginBtn.disabled = false;
      loginMsg.textContent = '';
    }

    async function updateRequestStatus(id, status) {
      const password = getSavedPassword();
      if (!password) return;

      const ok = confirm(`هل أنت متأكد أنك تريد تغيير الحالة إلى: ${status} ؟`);
      if (!ok) return;

      const res = await fetch(`${WORKER_BASE_URL}/update-status`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-admin-password': password
        },
        body: JSON.stringify({ id, status })
      });

      if (!res.ok) {
        const message = await getWorkerErrorMessage(res);
        alert(message);
        return;
      }

      await fetchRequests();
    }

    window.updateRequestStatus = updateRequestStatus;

    loginBtn.addEventListener('click', login);
    refreshBtn.addEventListener('click', fetchRequests);
    logoutBtn.addEventListener('click', function() {
      clearPassword();
      adminView.classList.add('hidden');
      loginView.classList.remove('hidden');
      adminPasswordInput.value = '';
    });

    statusFilter.addEventListener('change', renderRequests);
    typeFilter.addEventListener('change', renderRequests);
    searchInput.addEventListener('input', renderRequests);

    (function init() {
      const password = getSavedPassword();
      if (password) {
        loginView.classList.add('hidden');
        adminView.classList.remove('hidden');
        fetchRequests();
      }
    })();
  </script>
</body>
</html>
